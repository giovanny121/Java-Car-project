server.port=3000

# Datasource (overridden by compose environment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carrental}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:carrental}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:carrental}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Serve static assets straight from the source tree during development
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
